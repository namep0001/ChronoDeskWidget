name: Package MainForm source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Regenerate compressed source and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -f Source/MainForm.cs
          gzip -n -c Source/MainForm.cs | base64 --wrap=0 > Source/MainForm.cs.gz.b64
          source_hash="$(sha256sum Source/MainForm.cs | cut -d' ' -f1)"
          python3 - "$source_hash" <<'PY'
          import pathlib
          import re
          import sys

          script = pathlib.Path("restore-mainform.ps1")
          source = script.read_text(encoding="utf-8")
          replacement = "$expectedSha256 = '" + sys.argv[1] + "'"
          updated, count = re.subn(r"\$expectedSha256 = '[0-9a-f]+'", lambda _: replacement, source)
          if count != 1:
              raise SystemExit(f"Expected to update one checksum, found {count}")
          script.write_text(updated, encoding="utf-8", newline="\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/MainForm.cs.gz.b64 restore-mainform.ps1
          if git diff --cached --quiet; then
            echo "Compressed source and checksum are already synchronized."
            exit 0
          fi
          git commit -m "Sync packaged MainForm source"
          git push
