name: Publish ChronoDesk Widget Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.1

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build application
        shell: cmd
        run: build.bat
      - name: Prepare release package and notes
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -match '^\d+\.\d+$') { $version += '.0' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' is not a supported semantic version."
          }

          $notesPattern = '(?ms)^## \[' + [regex]::Escape($version) + '\].*?(?=^## |\z)'
          $changelog = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($changelog, $notesPattern)
          if (-not $match.Success) {
            throw "Could not find release notes for version $version in CHANGELOG.md."
          }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $packageFiles = @(
            'ChronoDeskWidget.exe',
            'Uninstall-Widget.bat',
            'Uninstall-Widget.ps1',
            'Uninstall-Widget.ico',
            'Uninstall ChronoDesk Widget (BAT).lnk',
            'Uninstall ChronoDesk Widget (PowerShell).lnk'
          )
          foreach ($file in $packageFiles) {
            $source = Join-Path 'bin/Release' $file
            if (-not (Test-Path -LiteralPath $source)) {
              throw "Required release package file is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination (Join-Path 'release' $file)
          }
          Copy-Item README.md release/
          Copy-Item CHANGELOG.md release/
          Set-Content -Path release/release-notes.md -Value $match.Value.Trim() -Encoding utf8
          Compress-Archive -Path (Get-ChildItem release -File | Where-Object { $_.Name -ne 'release-notes.md' } | ForEach-Object FullName) -DestinationPath release/ChronoDeskWidget-Windows.zip -Force
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ChronoDesk Widget ${{ inputs.tag || github.ref_name }}
          body_path: release/release-notes.md
          files: release/ChronoDeskWidget-Windows.zip
          draft: false
          prerelease: false
