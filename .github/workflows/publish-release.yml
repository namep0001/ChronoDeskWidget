name: Publish ChronoDesk Widget Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build application
        shell: cmd
        run: build.bat
      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path bin/Release/ChronoDeskWidget.exe -DestinationPath release/ChronoDeskWidget-Windows.zip -Force
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ChronoDesk Widget ${{ inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: release/ChronoDeskWidget-Windows.zip
          draft: false
          prerelease: false
